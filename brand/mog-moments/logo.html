<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:MB;src:url(../../stream-clipper/assets/fonts/Montserrat-Black.ttf)}
@font-face{font-family:MXB;src:url(../../stream-clipper/assets/fonts/Montserrat-ExtraBold.ttf)}
html,body{margin:0;background:transparent}
.tile{width:1024px;height:1024px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 38%,#26262b 0%,#0d0d10 62%)}
svg{position:absolute;inset:0}
.word{position:absolute;left:0;right:0;text-align:center;font-family:MB;color:#fff;letter-spacing:-6px}
</style></head><body>
<div class="tile" id="t">
<svg viewBox="0 0 1024 1024">
  <!-- sharp jawline mark -->
  <path d="M270 236 L270 486 L512 702 L754 486 L754 236" fill="none" stroke="#FFE14D" stroke-width="58" stroke-linejoin="miter" stroke-miterlimit="8" stroke-linecap="butt"/>
  <!-- play triangle -->
  <path d="M458 346 L458 506 L594 426 Z" fill="#FFFFFF"/>
</svg>
<div class="word" style="top:752px;font-size:132px;line-height:1">MOG</div>
<div class="word" style="top:872px;font-size:62px;line-height:1;letter-spacing:10px;font-family:MXB;color:#FFE14D">MOMENTS</div>
</div></body></html>
